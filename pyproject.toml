[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txnpipe"
version = "0.1.0"
description = "Real-time transaction anomaly pipeline: Kafka, PostgreSQL, Redis, FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.4,<3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0.29",
  "psycopg[binary]>=3.1.18",
  "alembic>=1.13",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "testcontainers[postgres,redis,kafka]>=4.4",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"txnpipe.api" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"tests/*" = ["T201"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: needs Docker (testcontainers)"]

[tool.coverage.run]
source = ["src/txnpipe"]
branch = true

[tool.coverage.report]
omit = ["src/txnpipe/consumer/main.py", "src/txnpipe/producer/simulator.py"]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
