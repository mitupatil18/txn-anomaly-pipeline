# Single-node KRaft broker for demos. Use a real Kafka (Strimzi, MSK, Confluent) in production.
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: txn-pipeline}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      enableServiceLinks: false   # otherwise Kubernetes injects KAFKA_PORT=tcp://..., which breaks the image
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports: [{containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources: {requests: {cpu: 200m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: txn-pipeline}
spec:
  selector: {app: kafka}
  ports: [{port: 9092}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: kafka-init, namespace: txn-pipeline}
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: init
          image: apache/kafka:3.7.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              B=kafka:9092; T=/opt/kafka/bin/kafka-topics.sh
              $T --bootstrap-server $B --create --if-not-exists --topic transactions.raw --partitions 6 --replication-factor 1 --config retention.ms=86400000
              $T --bootstrap-server $B --create --if-not-exists --topic transactions.dlq --partitions 1 --replication-factor 1 --config retention.ms=604800000
              $T --bootstrap-server $B --list
