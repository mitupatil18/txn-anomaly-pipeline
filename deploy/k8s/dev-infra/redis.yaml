apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: txn-pipeline}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 3
          resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: txn-pipeline}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
