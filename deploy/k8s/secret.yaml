# Demo credentials matching dev-infra/postgres.yaml. For a real cluster, create this Secret out of
# band (sealed-secrets, external-secrets, ...) and do not commit it.
apiVersion: v1
kind: Secret
metadata:
  name: txn-secret
  namespace: txn-pipeline
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://txn:txn@postgres:5432/txn
